<svg xmlns="http://www.w3.org/2000/svg" width="300" height="30" viewBox="0 0 300 30">
  <g fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.5">
    <!-- Left line -->
    <line x1="0" y1="15" x2="110" y2="15"/>
    <!-- Center diamond -->
    <polygon points="150,3 158,15 150,27 142,15" fill="#C9A84C" opacity="0.2"/>
    <polygon points="150,7 154,15 150,23 146,15" fill="#C9A84C" opacity="0.3"/>
    <!-- Small dots -->
    <circle cx="120" cy="15" r="2" fill="#C9A84C" opacity="0.3"/>
    <circle cx="180" cy="15" r="2" fill="#C9A84C" opacity="0.3"/>
    <circle cx="130" cy="15" r="1.2" fill="#C9A84C" opacity="0.2"/>
    <circle cx="170" cy="15" r="1.2" fill="#C9A84C" opacity="0.2"/>
    <!-- Right line -->
    <line x1="190" y1="15" x2="300" y2="15"/>
  </g>
</svg>
